<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jarvis</title>
  <style>
    :root{
      --bg:#f4f7fb;
      --card:#ffffff;
      --ink:#17212b;
      --muted:#627285;
      --line:#dfe7f0;
      --brand:#244a7c;
      --brand-2:#3a6ea5;
      --ok:#197a43;
      --warn:#b36a00;
      --bad:#b92e34;
      --soft:#eef4fb;
      --shadow:0 10px 30px rgba(23,33,43,.08);
      --radius:18px;
    }
    *{box-sizing:border-box}
    body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--ink)}
    .app{max-width:1180px;margin:0 auto;padding:18px 16px 96px}
    .topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px;flex-wrap:nowrap}
    .title-wrap h1{margin:0;font-size:38px;letter-spacing:-0.04em;font-weight:900;color:var(--brand);line-height:1}
    .title-wrap p{margin:6px 0 0;color:var(--muted);max-width:680px}
    .actions{display:flex;gap:8px;flex-wrap:wrap}
    button,select,input,textarea{font:inherit}
    .btn{border:none;background:var(--brand);color:white;padding:12px 14px;border-radius:14px;cursor:pointer;font-weight:800;box-shadow:0 8px 18px rgba(36,74,124,.16)}
    .btn.secondary{background:white;color:var(--brand);border:1px solid var(--line);box-shadow:none}
    .btn.ghost{background:var(--soft);color:var(--brand)}
    .btn.warn{background:var(--warn)}
    .btn.bad{background:var(--bad)}
    .btn.ok{background:var(--ok)}
    .tabs{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-bottom:16px}
    .tab{background:white;border:1px solid var(--line);padding:12px;border-radius:16px;text-align:center;cursor:pointer;font-weight:700;color:var(--muted)}
    .tab.active{background:var(--brand);color:white;border-color:var(--brand)}
    .view{display:none}
    .view.active{display:block}
    .grid{display:grid;gap:16px}
    .grid.kpi{grid-template-columns:repeat(4,1fr)}
    .grid.two{grid-template-columns:1.35fr .95fr}
    .grid.three{grid-template-columns:repeat(3,1fr)}
    .card{background:var(--card);border-radius:22px;padding:16px;box-shadow:0 12px 32px rgba(23,33,43,.06);border:1px solid #e9eff6}
    .card h3,.card h2{margin:0 0 12px}
    .muted{color:var(--muted)}
    .kpi .card{padding:18px}
    .kpi-value{font-size:28px;font-weight:800;margin-top:8px}
    .kpi-value.ok{color:var(--ok)}
    .kpi-value.bad{color:var(--bad)}
    .kpi-value.warn{color:var(--warn)}
    .toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
    .toolbar input,.toolbar select,.field input,.field select,.field textarea{width:100%;padding:12px 12px;border:1px solid var(--line);border-radius:12px;background:white}
    .field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
    .field label{font-size:14px;color:var(--muted);font-weight:700}
    .list{display:flex;flex-direction:column;gap:10px}
    .item{display:flex;justify-content:space-between;gap:12px;padding:12px;border:1px solid var(--line);border-radius:14px;background:#fbfdff;align-items:flex-start}
    .item-left{min-width:0}
    .item-title{font-weight:800;margin-bottom:4px}
    .item-sub{color:var(--muted);font-size:14px;line-height:1.4}
    .item-actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
    .mini{padding:8px 10px;border-radius:10px;font-size:13px}
    .pill{display:inline-block;padding:6px 9px;border-radius:999px;font-size:12px;font-weight:700;background:var(--soft);color:var(--brand);margin-right:6px;margin-top:4px}
    .pill.ok{background:#e7f7ee;color:var(--ok)}
    .pill.bad{background:#fdeced;color:var(--bad)}
    .pill.warn{background:#fff3e0;color:var(--warn)}
    .section-title{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
    .empty{padding:18px;border:1px dashed var(--line);border-radius:14px;text-align:center;color:var(--muted);background:#fafcff}
    .month-nav{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
    .month-chip{padding:10px 12px;background:var(--soft);border-radius:12px;font-weight:700;color:var(--brand)}
    .split{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    .inline{display:flex;gap:10px;flex-wrap:wrap}
    .shop-tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
    .shop-tab{padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:white;cursor:pointer;font-weight:700}
    .shop-tab.active{background:var(--brand);color:white;border-color:var(--brand)}
    .footer-nav{position:fixed;left:0;right:0;bottom:0;background:white;border-top:1px solid var(--line);display:none;grid-template-columns:repeat(6,1fr);z-index:5}
    .footer-nav button{padding:13px 4px;border:none;background:none;font-size:15.84px;color:var(--muted);font-weight:800;line-height:1.15}
    .footer-nav button.active{color:var(--brand)}
    .notice{background:#f1f7ff;border:1px solid #d6e6fb;color:var(--brand);padding:12px;border-radius:14px;margin-top:12px}
    .danger-note{background:#fff5f5;border:1px solid #ffd7d7;color:#8c2a2a;padding:12px;border-radius:14px;margin-top:12px}

    .auth-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
    .auth-card{background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:24px;padding:28px;max-width:420px;width:100%}
    .auth-logo{width:56px;height:56px;border-radius:18px;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:800;margin-bottom:14px}
    .small{font-size:14px}
    .app-shell{display:none}
    .user-pill{display:none}
    .user-name-home{font-size:28px;font-weight:800;margin:0 0 14px;letter-spacing:-0.03em}
    .btn.compact{padding:10px 12px;border-radius:12px;font-size:15px}
    .topbar-user{font-size:15px;font-weight:700;color:var(--ink);margin-left:auto;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:44%;flex:0 1 44%}
    .home-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:stretch}
    .home-actions .btn{width:100%;white-space:nowrap;padding-left:8px;padding-right:8px}
    .home-summary-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
    .summary-mini{background:#f8fafc;border:1px solid var(--line);border-radius:18px;padding:12px}
    .summary-mini .label{font-size:12px;color:var(--muted);margin-bottom:6px;font-weight:700}
    .summary-mini .value{font-size:20px;font-weight:800;line-height:1.15}
    .summary-mini .value.ok{color:var(--ok)}
    .summary-mini .value.bad{color:var(--bad)}
    .finance-card{padding:14px}
    .finance-year-bar{display:flex;flex-direction:column;gap:12px;margin-bottom:12px}
    .finance-header-row{display:flex;align-items:center;justify-content:center;gap:18px;margin-bottom:4px}
    .finance-year-nav{display:flex;align-items:center;justify-content:center;gap:18px}
    .finance-year-value{font-size:40px;font-weight:800;line-height:1}
    .finance-toolbar-line{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:8px;align-items:center}
    .finance-toolbar-line .btn{padding:10px 12px;border-radius:12px;background:var(--brand);color:#fff}
    .finance-select select{width:100%;padding:10px 12px;border-radius:12px;font-weight:800;background:var(--brand);color:#fff;border:none;box-shadow:0 8px 18px rgba(36,74,124,.16)}
    .finance-table-wrap{border:1px solid var(--line);border-radius:18px;overflow:hidden;background:#fff}
    .finance-table{width:100%;border-collapse:collapse;table-layout:fixed}
    .finance-table th,.finance-table td{padding:12px 4px;border-bottom:1px solid #edf1f5;text-align:center;font-size:13px}
    .finance-table th{background:#f8fafc;color:var(--muted);font-weight:800}
    .finance-table td:first-child,.finance-table th:first-child{text-align:left;padding-left:10px;font-weight:800}
    .finance-table td{font-weight:700}
    .finance-table td:not(:first-child){font-size:14px}
    .finance-table th:not(:first-child){font-size:12.5px}
    .finance-table .money-pos,.finance-table .money-neg,.finance-table .money-neutral{font-size:14px;font-weight:800}
    .finance-table tr:last-child td{border-bottom:none}
    .money-pos{color:var(--ok);font-weight:700}
    .money-neg{color:var(--bad);font-weight:700}
    .money-neutral{color:var(--ink);font-weight:700}
    .finance-summary-compact{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
    .finance-mini-card{background:#f8fafc;border:1px solid var(--line);border-radius:16px;padding:12px}
    .finance-mini-card .label{font-size:13px;color:var(--muted);margin-bottom:6px}
    .finance-mini-card .value{font-size:24px;font-weight:800}
    .finance-mini-card .sub{font-size:12px;color:var(--muted);margin-top:4px}

    .finance-month-btn{background:none;border:none;padding:0;color:var(--ink);font-weight:800;font-size:16px;cursor:pointer}
    .finance-table td:first-child .finance-month-btn{display:block;width:100%;text-align:left}
    .summary-mini.static{cursor:default}
    .summary-mini.static .value{white-space:nowrap}
    .pending-link-card{cursor:pointer}
    .pending-link-card:hover,.finance-month-btn:hover{text-decoration:underline}
    .month-overview-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}
    .month-overview-option{border:1px solid var(--line);border-radius:16px;background:#f8fafc;padding:14px;cursor:pointer}
    .month-overview-option .title{font-weight:800;margin-bottom:6px}
    .month-overview-option .sub{font-size:13px;color:var(--muted)}
    .modal-actions-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}

    @media (max-width: 980px){
      .grid.kpi,.grid.two,.grid.three,.split{grid-template-columns:1fr 1fr}
      .tabs{grid-template-columns:repeat(3,1fr)}
    }
    @media (max-width: 720px){
      .grid.kpi,.grid.two,.grid.three,.split{grid-template-columns:1fr}
      .tabs{display:none}
      .footer-nav{display:grid}
      .app{padding-bottom:96px}
      .topbar{align-items:center;gap:8px;flex-wrap:nowrap}
      .title-wrap{min-width:0;flex:1 1 auto}
      .title-wrap h1{font-size:32px}
      .kpi-value{font-size:24px}
      .item{flex-direction:column}
      .item-actions{justify-content:flex-start}
      .finance-year-value{font-size:34px}
      .finance-toolbar-line{grid-template-columns:1fr 1fr 1fr}
      .finance-table th,.finance-table td{font-size:12px;padding:10px 2px}
      .finance-table td:not(:first-child){font-size:13px}
      .finance-table .money-pos,.finance-table .money-neg,.finance-table .money-neutral{font-size:13px}
      .finance-summary-compact{grid-template-columns:1fr}
      .home-actions{grid-template-columns:1fr 1fr}
      .home-summary-row{grid-template-columns:1fr}
      .month-overview-grid,.modal-actions-row{grid-template-columns:1fr}
      .summary-mini .value{font-size:17px}
      .topbar-user{font-size:14px;max-width:42%;flex:0 1 42%}
    }
  </style>
</head>
<body>
  <div id="authScreen" class="auth-screen">
    <div class="auth-card">
      <div class="auth-logo">J</div>
      <h1>Jarvis</h1>
      <p>Controle financeiro, agenda, tarefas e compras em um só lugar.</p>
      <button class="btn" id="googleLoginBtn">Entrar com Google</button>
      <p class="small muted" style="margin-top:14px">Depois do primeiro acesso, o Jarvis abre já conectado no mesmo aparelho.</p>
    </div>
  </div>

  <div id="appShell" class="app-shell">
    <div class="app">
    <div class="topbar">
      <div class="title-wrap">
        <h1>Jarvis</h1>
        <p>Controle financeiro, agenda, tarefas e compras em um só lugar.</p>
      </div>

    </div>

    <div class="tabs" id="desktopTabs"></div>

    <section class="view active" id="view-inicio"></section>
    <section class="view" id="view-financeiro"></section>
    <section class="view" id="view-agenda"></section>
    <section class="view" id="view-tarefas"></section>
    <section class="view" id="view-compras"></section>
    <section class="view" id="view-config"></section>
    </div>

    <div class="footer-nav" id="mobileTabs"></div>
  </div>

  <dialog id="formDialog" style="border:none;border-radius:20px;max-width:720px;width:calc(100% - 24px);padding:0;box-shadow:0 20px 60px rgba(0,0,0,.2)"></dialog>
  <input type="file" id="importFile" accept="application/json" style="display:none" />

  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js';
    import {
      getAuth,
      GoogleAuthProvider,
      onAuthStateChanged,
      setPersistence,
      browserLocalPersistence,
      signInWithRedirect,
      getRedirectResult,
      signOut
    } from 'https://www.gstatic.com/firebasejs/12.11.0/firebase-auth.js';
    import { getFirestore, doc, onSnapshot, setDoc } from 'https://www.gstatic.com/firebasejs/12.11.0/firebase-firestore.js';

    const firebaseConfig = {
      apiKey: "AIzaSyA10HIz1bpzh6NE1fLBZGlt36VQaYvrlKo",
      authDomain: "jarvis-controle-pessoal.firebaseapp.com",
      projectId: "jarvis-controle-pessoal",
      storageBucket: "jarvis-controle-pessoal.firebasestorage.app",
      messagingSenderId: "362750721688",
      appId: "1:362750721688:web:1fdad74d2a7aa9870c9aed"
    };

    const firebaseApp = initializeApp(firebaseConfig);
    const auth = getAuth(firebaseApp);
    const provider = new GoogleAuthProvider();
    const db = getFirestore(firebaseApp);
    const sharedStateRef = doc(db, 'jarvis', 'shared_state');
    let cloudReady = false;
    let cloudSyncTimer = null;
    let lastCloudHash = '';
    let syncStarted = false;
    let currentUser = null;

    const STORAGE_KEY = 'jarvis_v2';
    const TABS = [
      { id:'inicio', label:'Início', icon:'🏠' },
      { id:'financeiro', label:'Financeiro', icon:'💰' },
      { id:'agenda', label:'Agenda', icon:'📅' },
      { id:'tarefas', label:'Tarefas', icon:'✅' },
      { id:'compras', label:'Compras', icon:'🛒' },
      { id:'config', label:'Config.', icon:'⚙️' },
    ];

    const monthNames = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
    const pad = n => String(n).padStart(2,'0');
    const today = new Date();

    const seedRecurring = [
      { name:'EMPRESTIMO BRB', category:'Empréstimos', type:'fixa', amount:1903.14, dueDay:5, paymentMethod:'Boleto', repeat:true },
      { name:'AGUA', category:'Casa', type:'fixa', amount:200.00, dueDay:13, paymentMethod:'Pix', repeat:true },
      { name:'ENERGIA', category:'Casa', type:'fixa', amount:50.00, dueDay:13, paymentMethod:'Pix', repeat:true },
      { name:'INTERNET CLARO', category:'Casa', type:'fixa', amount:405.00, dueDay:15, paymentMethod:'Cartão', repeat:true },
      { name:'INSS', category:'Impostos', type:'fixa', amount:166.98, dueDay:15, paymentMethod:'Pix', repeat:true },
      { name:'ALUGUEL CASA', category:'Moradia', type:'fixa', amount:2520.00, dueDay:20, paymentMethod:'Transferência', repeat:true },
      { name:'FINANCIAMENTO BYD', category:'Carro', type:'fixa', amount:3286.00, dueDay:26, paymentMethod:'Débito', repeat:true },
      { name:'FAXINA LUZIA', category:'Serviços', type:'fixa', amount:720.00, dueDay:27, paymentMethod:'Pix', repeat:true },
      { name:'BRADESCO SAUDE', category:'Saúde', type:'fixa', amount:2736.00, dueDay:29, paymentMethod:'Débito', repeat:true },
      { name:'BRADESCO SAUDE (CONTADOR)', category:'Saúde', type:'fixa', amount:150.00, dueDay:29, paymentMethod:'Pix', repeat:true },
      { name:'CARTÃO SICREDI', category:'Cartões', type:'variável', amount:480.00, dueDay:10, paymentMethod:'Cartão', repeat:true },
      { name:'CARTÃO ITAU', category:'Cartões', type:'variável', amount:265.00, dueDay:20, paymentMethod:'Cartão', repeat:true },
      { name:'CARTÃO MERCADO PAGO', category:'Cartões', type:'variável', amount:190.00, dueDay:20, paymentMethod:'Cartão', repeat:true },
      { name:'CARTÃO BRB', category:'Cartões', type:'variável', amount:1800.00, dueDay:25, paymentMethod:'Cartão', repeat:true },
      { name:'CARTÃO C6', category:'Cartões', type:'variável', amount:783.00, dueDay:25, paymentMethod:'Cartão', repeat:true },
      { name:'CARTÃO SANTANDER', category:'Cartões', type:'variável', amount:135.00, dueDay:25, paymentMethod:'Cartão', repeat:true },
    ];

    const defaultState = () => ({
      currentTab: 'inicio',
      selectedMonth: `${today.getFullYear()}-${pad(today.getMonth()+1)}`,
      shoppingView: 'mercado',
      financeView: 'todas',
      settings: {
        systemName: 'Jarvis',
        user1: 'Cláudio',
        user2: 'Esposa',
        currency: 'BRL'
      },
      expenses: [],
      recurringTemplates: [...seedRecurring],
      appointments: [],
      tasks: [],
      shopping: [],
      income: [],
      goals: []
    });

    let state = loadState();
    ensureRecurringForMonth(state.selectedMonth);
    initAuth();

    async function initAuth(){
      document.getElementById('googleLoginBtn').addEventListener('click', loginWithGoogle);
      try{
        await setPersistence(auth, browserLocalPersistence);
      }catch(error){
        console.error('Erro ao definir persistência do login:', error);
      }

      try{
        await getRedirectResult(auth);
      }catch(error){
        console.error('Erro no login com Google:', error);
        alert('Não consegui concluir o login com Google.');
      }

      onAuthStateChanged(auth, (user) => {
        currentUser = user || null;
        if(user){
          showApp(user);
          if(!syncStarted){
            renderAll();
            startCloudSync();
            syncStarted = true;
          }else{
            renderAll();
          }
        }else{
          showAuth();
        }
      });
    }

    async function loginWithGoogle(){
      try{
        await signInWithRedirect(auth, provider);
      }catch(error){
        console.error('Erro ao iniciar login com Google:', error);
        alert('Não consegui iniciar o login com Google.');
      }
    }

    async function logout(){
      try{
        await signOut(auth);
      }catch(error){
        console.error('Erro ao sair:', error);
      }
    }

    function showAuth(){
      document.getElementById('authScreen').style.display = 'flex';
      document.getElementById('appShell').style.display = 'none';
    }

    function showApp(user){
      document.getElementById('authScreen').style.display = 'none';
      document.getElementById('appShell').style.display = 'block';
      const holder = document.getElementById('userBadge');
      if(holder) holder.innerHTML = '';
      const topbarUserName = document.getElementById('topbarUserName');
      if(topbarUserName) topbarUserName.textContent = user?.displayName || user?.email || state.settings.user1 || 'Usuário';
    }

    function loadState(){
      try{
        const saved = localStorage.getItem(STORAGE_KEY);
        if(!saved) return defaultState();
        const merged = { ...defaultState(), ...JSON.parse(saved) };
        merged.currentTab = 'inicio';
        return merged;
      }catch{
        return defaultState();
      }
    }
    function saveState(){
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }
    function getCloudPayload(){
      return {
        settings: state.settings,
        expenses: state.expenses,
        recurringTemplates: state.recurringTemplates,
        appointments: state.appointments,
        tasks: state.tasks,
        shopping: state.shopping,
        income: state.income,
        goals: state.goals
      };
    }
    function getCloudHash(payload = getCloudPayload()){
      return JSON.stringify(payload);
    }
    function applyCloudPayload(payload){
      state = {
        ...defaultState(),
        ...state,
        ...payload,
        currentTab: 'inicio',
        selectedMonth: state.selectedMonth || `${today.getFullYear()}-${pad(today.getMonth()+1)}`,
        shoppingView: state.shoppingView || 'mercado'
      };
      ensureRecurringForMonth(state.selectedMonth);
      renderAll();
    }
    async function pushCloudState(){
      if(!cloudReady) return;
      const payload = getCloudPayload();
      const hash = getCloudHash(payload);
      if(hash === lastCloudHash) return;
      try{
        await setDoc(sharedStateRef, {
          state: payload,
          updatedAt: new Date().toISOString(),
          app: 'Jarvis'
        }, { merge: true });
        lastCloudHash = hash;
      }catch(error){
        console.error('Erro ao salvar no Firebase:', error);
      }
    }
    function scheduleCloudSync(){
      if(!cloudReady) return;
      const payload = getCloudPayload();
      const hash = getCloudHash(payload);
      if(hash === lastCloudHash) return;
      clearTimeout(cloudSyncTimer);
      cloudSyncTimer = setTimeout(() => { pushCloudState(); }, 700);
    }
    function startCloudSync(){
      try{
        onSnapshot(sharedStateRef, (snapshot) => {
          cloudReady = true;
          if(snapshot.exists() && snapshot.data()?.state){
            const incoming = snapshot.data().state;
            const incomingHash = getCloudHash(incoming);
            if(incomingHash !== lastCloudHash){
              lastCloudHash = incomingHash;
              applyCloudPayload(incoming);
            }
          } else {
            pushCloudState();
          }
        }, (error) => {
          console.error('Erro na sincronização com Firebase:', error);
          cloudReady = false;
        });
      }catch(error){
        console.error('Erro ao iniciar Firebase:', error);
        cloudReady = false;
      }
    }
    function uid(prefix='id'){ return `${prefix}_${Date.now()}_${Math.random().toString(36).slice(2,8)}`; }
    function formatMoney(v){
      return new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(Number(v||0));
    }
    function formatDate(dateStr){
      if(!dateStr) return '-';
      const d = new Date(dateStr+'T00:00:00');
      return d.toLocaleDateString('pt-BR');
    }
    function currentMonthLabel(){
      const [year,month] = state.selectedMonth.split('-');
      return `${monthNames[Number(month)-1]} / ${year}`;
    }
    function nextMonth(monthKey, delta){
      let [y,m] = monthKey.split('-').map(Number);
      m += delta;
      if(m<1){ m=12; y--; }
      if(m>12){ m=1; y++; }
      return `${y}-${pad(m)}`;
    }
    function getMonthExpenseList(monthKey){
      return state.expenses.filter(x=>x.month===monthKey).sort((a,b)=>a.dueDate.localeCompare(b.dueDate));
    }
    function getMonthIncomeList(monthKey){
      return state.income.filter(x=>x.month===monthKey).sort((a,b)=>a.date.localeCompare(b.date));
    }
    function ensureRecurringForMonth(monthKey){
      const [year, month] = monthKey.split('-');
      state.recurringTemplates.forEach(t => {
        const exists = state.expenses.some(e => e.month===monthKey && e.templateId===t.templateId);
        if(!exists){
          if(!t.templateId) t.templateId = uid('tpl');
          state.expenses.push({
            id: uid('exp'),
            templateId: t.templateId,
            month: monthKey,
            name: t.name,
            category: t.category,
            type: t.type,
            amount: Number(t.amount),
            actualAmount: Number(t.amount),
            dueDate: `${year}-${month}-${pad(t.dueDay)}`,
            paymentMethod: t.paymentMethod || '',
            notes: '',
            paid: false,
            repeat: true,
            createdAt: new Date().toISOString()
          });
        }
      });
      saveState();
    }
    function monthSummary(monthKey){
      const list = getMonthExpenseList(monthKey);
      const incomes = getMonthIncomeList(monthKey);
      const total = list.reduce((s,x)=>s+Number(x.actualAmount||x.amount||0),0);
      const paid = list.filter(x=>x.paid).reduce((s,x)=>s+Number(x.actualAmount||x.amount||0),0);
      const pending = total - paid;
      const cards = list.filter(x=>x.category==='Cartões' || x.name.toLowerCase().includes('cartão')).reduce((s,x)=>s+Number(x.actualAmount||x.amount||0),0);
      const totalIncome = incomes.reduce((s,x)=>s+Number(x.amount||0),0);
      return { total, paid, pending, cards, totalIncome, balance: totalIncome-total, countPending:list.filter(x=>!x.paid).length };
    }
    function upcomingExpenses(limit=5){
      const now = new Date();
      const all = [...state.expenses]
        .filter(e=>!e.paid)
        .sort((a,b)=>a.dueDate.localeCompare(b.dueDate));
      return all.filter(e => new Date(e.dueDate+'T00:00:00') >= new Date(now.getFullYear(), now.getMonth(), now.getDate())).slice(0, limit);
    }
    function upcomingAppointments(limit=5){
      const todayDate = new Date();
      return [...state.appointments]
        .sort((a,b)=>`${a.date}${a.time||''}`.localeCompare(`${b.date}${b.time||''}`))
        .filter(a => new Date(`${a.date}T${a.time || '00:00'}:00`) >= todayDate)
        .slice(0,limit);
    }
    function pendingTasks(limit=5){
      return state.tasks.filter(t=>t.status!=='concluída').sort((a,b)=>(a.deadline||'9999').localeCompare(b.deadline||'9999')).slice(0,limit);
    }
    function pendingShopping(limit=6){
      return state.shopping.filter(i=>!i.done).slice(0,limit);
    }


    function currentUserName(){
      return currentUser?.displayName || currentUser?.email || state.settings.user1 || 'Usuário';
    }
    function getSelectedYear(){
      return Number(state.selectedMonth.split('-')[0]);
    }
    function changeFinanceYear(delta){
      const [y,m] = state.selectedMonth.split('-').map(Number);
      state.selectedMonth = `${y + delta}-${pad(m)}`;
      ensureRecurringForMonth(state.selectedMonth);
      renderAll();
    }
    function setFinanceView(view){
      state.financeView = view;
      renderAll();
    }
    function getGoalForMonth(monthKey){
      return state.goals.find(g => g.month===monthKey) || null;
    }
    function goalAmountForMonth(monthKey){
      return Number(getGoalForMonth(monthKey)?.amount || 0);
    }
    function yearSummary(year){
      let entradas = 0, saidas = 0, metas = 0;
      for(let m=1;m<=12;m++){
        const monthKey = `${year}-${pad(m)}`;
        const ms = monthSummary(monthKey);
        entradas += ms.totalIncome;
        saidas += ms.total;
        metas += goalAmountForMonth(monthKey);
      }
      return { entradas, saidas, metas, saldo: entradas - saidas };
    }
    function getMonthlyFinanceRows(year){
      return monthNames.map((name, idx) => {
        const monthKey = `${year}-${pad(idx+1)}`;
        const ms = monthSummary(monthKey);
        return {
          monthKey,
          monthShort: name.slice(0,3),
          monthFull: name,
          entradas: ms.totalIncome,
          saidas: ms.total,
          metas: goalAmountForMonth(monthKey),
          saldo: ms.balance,
          pending: ms.pending,
          countPending: ms.countPending
        };
      });
    }
    function getPendingExpenses(monthKey){
      return getMonthExpenseList(monthKey).filter(x=>!x.paid);
    }
    function openFinanceMonth(monthKey){
      const ms = monthSummary(monthKey);
      const goal = goalAmountForMonth(monthKey);
      const monthName = monthNames[Number(monthKey.slice(5,7))-1];
      openDialog(`
        <div class="card" style="box-shadow:none;border:none;padding:20px">
          <div class="section-title">
            <h2 style="margin:0">${monthName} ${monthKey.slice(0,4)}</h2>
            <button type="button" class="btn secondary mini" onclick="closeDialog()">Fechar</button>
          </div>
          <div class="month-overview-grid">
            <button class="month-overview-option" onclick="openMonthEntries('${monthKey}')">
              <div class="title">Entradas do mês</div>

            </button>
            <button class="month-overview-option" onclick="openMonthExpenses('${monthKey}', false)">
              <div class="title">Saídas do mês</div>
              <div class="sub">${formatMoney(ms.total)} • ${ms.countPending} pendência(s)</div>
            </button>
            <button class="month-overview-option" onclick="openMonthGoal('${monthKey}')">
              <div class="title">Meta do mês</div>
              <div class="sub">${goal ? formatMoney(goal) : 'Nenhuma meta cadastrada'}</div>
            </button>
          </div>
        </div>
      `);
    }
    function openMonthEntries(monthKey){
      const list = getMonthIncomeList(monthKey);
      const monthName = monthNames[Number(monthKey.slice(5,7))-1];
      openDialog(`
        <div class="card" style="box-shadow:none;border:none;padding:20px">
          <div class="section-title">
            <h2 style="margin:0">Entradas • ${monthName} ${monthKey.slice(0,4)}</h2>
            <button type="button" class="btn secondary mini" onclick="openFinanceMonth('${monthKey}')">Voltar</button>
          </div>
          ${list.length ? `<div class="list">${list.map(i => `

                <button class="btn secondary mini" onclick="openIncomeForm('${i.id}')">Editar</button>

    function openMonthExpenses(monthKey, pendingOnly=false){
      const fullList = pendingOnly ? getPendingExpenses(monthKey) : getMonthExpenseList(monthKey);
      const monthName = monthNames[Number(monthKey.slice(5,7))-1];
      openDialog(`
        <div class="card" style="box-shadow:none;border:none;padding:20px">
          <div class="section-title">
            <h2 style="margin:0">${pendingOnly ? 'Saídas pendentes' : 'Saídas do mês'} • ${monthName} ${monthKey.slice(0,4)}</h2>
            <button type="button" class="btn secondary mini" onclick="openFinanceMonth('${monthKey}')">Voltar</button>
          </div>
          ${fullList.length ? `<div class="list">${fullList.map(e => `
            <div class="item">
              <div class="item-left">
                <div class="item-title">${e.name}</div>

                <div>${e.paid ? '<span class="pill ok">Pago</span>' : '<span class="pill warn">Pendente</span>'}</div>
              </div>
              <div class="item-actions">
                <strong>${formatMoney(e.actualAmount || e.amount)}</strong>
                ${e.paid ? `<button class="btn secondary mini" onclick="togglePaid('${e.id}');openMonthExpenses('${monthKey}', ${pendingOnly})">Desmarcar</button>` : `<button class="btn ok mini" onclick="togglePaid('${e.id}');openMonthExpenses('${monthKey}', ${pendingOnly})">Dar baixa</button>`}
                <button class="btn secondary mini" onclick="openExpenseForm('${e.id}')">Editar</button>
              </div>
            </div>`).join('')}</div>` : `<div class="empty">${pendingOnly ? 'Nenhuma saída pendente neste mês.' : 'Nenhuma saída lançada neste mês.'}</div>`}
          <div class="modal-actions-row">
            <button class="btn" onclick="closeDialog(); state.selectedMonth='${monthKey}'; openExpenseForm()">+ Adicionar despesa</button>
            <button class="btn secondary" onclick="openMonthExpenses('${monthKey}', true)">Ver só pendências</button>
          </div>
        </div>
      `);
    }
    function openMonthGoal(monthKey){
      const goal = getGoalForMonth(monthKey);
      const ms = monthSummary(monthKey);
      const monthName = monthNames[Number(monthKey.slice(5,7))-1];
      const amount = Number(goal?.amount || 0);
      const diff = amount ? ms.balance - amount : 0;
      openDialog(`
        <form class="card" style="box-shadow:none;border:none;padding:20px" onsubmit="saveGoal(event, '${monthKey}')">
          <div class="section-title">
            <h2 style="margin:0">Meta • ${monthName} ${monthKey.slice(0,4)}</h2>
            <button type="button" class="btn secondary mini" onclick="openFinanceMonth('${monthKey}')">Voltar</button>
          </div>
          <div class="field">
            <label>Meta do mês</label>
            <input name="amount" type="number" step="0.01" value="${amount || ''}" placeholder="Digite o valor da meta">
          </div>
          <div class="notice">
            Saldo do mês: ${formatMoney(ms.balance)}<br>
            ${amount ? `Diferença para a meta: ${formatMoney(diff)}` : 'Cadastre a meta para acompanhar a diferença.'}
          </div>
          <div class="modal-actions-row">
            <button class="btn" type="submit">Salvar meta</button>
            <button class="btn secondary" type="button" onclick="openFinanceMonth('${monthKey}')">Fechar</button>
          </div>
        </form>
      `);
    }
    function saveGoal(event, monthKey){
      event.preventDefault();
      const fd = new FormData(event.target);
      const amount = Number(fd.get('amount') || 0);
      const idx = state.goals.findIndex(g => g.month===monthKey);
      if(idx >= 0){
        state.goals[idx] = { ...state.goals[idx], amount };
      }else{
        state.goals.push({ id: uid('goal'), month: monthKey, amount });
      }
      closeDialog();
      renderAll();
      openMonthGoal(monthKey);
    }
    function compactMoney(value){
      const n = Number(value || 0);
      return new Intl.NumberFormat('pt-BR', { maximumFractionDigits: 0 }).format(n);
    }
    function financeValueClass(value){
      if(Number(value) > 0) return 'money-pos';
      if(Number(value) < 0) return 'money-neg';
      return 'money-neutral';
    }

          </div>
          <div class="shop-tabs">${options.map(o=>`<button class="shop-tab ${state.shoppingView===o?'active':''}" onclick="setShoppingView('${o}')">${o}</button>`).join('')}</div>

            <div class="item">
              <div class="item-left">

    function renderSimpleList(list, renderLine, emptyText){
      return list.length ? `<div class="list">${list.map(x => `<div class="item"><div class="item-left">${renderLine(x)}</div></div>`).join('')}</div>` : `<div class="empty">${emptyText}</div>`;

    function changeMonth(delta){

    function updateSetting(key, value){
      state.settings[key] = value;
      saveState();
    }

    function openQuickAction(){
      openDialog(`
        <div class="card" style="box-shadow:none;border:none;padding:20px">
          <h2 style="margin-top:0">Ação rápida</h2>

    function openExpenseForm(id=''){
      const item = id ? state.expenses.find(x=>x.id===id) : null;
      openDialog(`
        <form class="card" style="box-shadow:none;border:none;padding:20px" onsubmit="saveExpense(event, '${id}')">
          <div class="section-title"><h2 style="margin:0">${item ? 'Editar despesa' : 'Nova despesa'}</h2><button type="button" class="btn secondary mini" onclick="closeDialog()">Fechar</button></div>
          <div class="split">
            <div class="field"><label>Nome da despesa</label><input name="name" required value="${escapeAttr(item?.name || '')}"></div>
            <div class="field"><label>Categoria</label><input name="category" required value="${escapeAttr(item?.category || '')}" placeholder="Ex: Moradia, Saúde, Cartões"></div>
            <div class="field"><label>Tipo</label><select name="type"><option ${item?.type==='fixa'?'selected':''}>fixa</option><option ${item?.type==='variável'?'selected':''}>variável</option></select></div>
            <div class="field"><label>Valor</label><input name="amount" type="number" step="0.01" required value="${item?.actualAmount || item?.amount || ''}"></div>
            <div class="field"><label>Vencimento</label><input name="dueDate" type="date" required value="${escapeAttr(item?.dueDate || `${state.selectedMonth}-01`)}"></div>
            <div class="field"><label>Forma de pagamento</label><input name="paymentMethod" value="${escapeAttr(item?.paymentMethod || '')}" placeholder="Pix, cartão, boleto..."></div>
          </div>
          <div class="field"><label>Observação</label><textarea name="notes" rows="3" placeholder="Opcional">${escapeHtml(item?.notes || '')}</textarea></div>
          <div class="inline">
            <label><input name="paid" type="checkbox" ${item?.paid ? 'checked' : ''}> Já foi paga</label>
            <label><input name="repeat" type="checkbox" ${item?.repeat || !item ? 'checked' : ''}> Repetir todo mês</label>
          </div>
          <div class="inline" style="margin-top:16px">
            <button class="btn" type="submit">Salvar</button>
            <button class="btn secondary" type="button" onclick="closeDialog()">Cancelar</button>
          </div>
        </form>
      `);
    }

    function saveExpense(event, id=''){
      event.preventDefault();
      const fd = new FormData(event.target);
      const expense = {
        id: id || uid('exp'),
        month: (fd.get('dueDate') || `${state.selectedMonth}-01`).slice(0,7),
        name: fd.get('name'),
        category: fd.get('category'),
        type: fd.get('type'),
        amount: Number(fd.get('amount') || 0),
        actualAmount: Number(fd.get('amount') || 0),
        dueDate: fd.get('dueDate'),
        paymentMethod: fd.get('paymentMethod'),
        notes: fd.get('notes'),
        paid: fd.get('paid') === 'on',
        repeat: fd.get('repeat') === 'on',
        createdAt: new Date().toISOString(),
      };
      if(id){
        const idx = state.expenses.findIndex(x=>x.id===id);
        const old = state.expenses[idx] || {};
        state.expenses[idx] = { ...old, ...expense };
      }else{
        state.expenses.push(expense);
      }
      if(expense.repeat){
        upsertRecurringTemplate(expense);
      }
      state.selectedMonth = expense.month;
      closeDialog();
      renderAll();
    }

    function upsertRecurringTemplate(expense){
      let existing = state.recurringTemplates.find(t => t.name===expense.name && t.category===expense.category);
      const dueDay = Number((expense.dueDate || '').slice(-2)) || 1;
      if(existing){
        existing.type = expense.type;
        existing.amount = Number(expense.actualAmount || expense.amount || 0);
        existing.dueDay = dueDay;
        existing.paymentMethod = expense.paymentMethod;
      }else{
        state.recurringTemplates.push({
          templateId: uid('tpl'),
          name: expense.name,
          category: expense.category,
          type: expense.type,
          amount: Number(expense.actualAmount || expense.amount || 0),
          dueDay,
          paymentMethod: expense.paymentMethod,
          repeat: true
        });
      }
    }

    function togglePaid(id){
      const item = state.expenses.find(x=>x.id===id);
      if(!item) return;
      item.paid = !item.paid;
      renderAll();
    }
    function deleteExpense(id){
      if(!confirm('Excluir esta despesa?')) return;
      state.expenses = state.expenses.filter(x=>x.id!==id);
      renderAll();
    }

            <div class="field"><label>Descrição</label><input name="description" required value="${escapeAttr(item?.description || '')}"></div>
            <div class="field"><label>Categoria</label><input name="category" value="${escapeAttr(item?.category || '')}" placeholder="Salário, extra, venda..."></div>
            <div class="field"><label>Valor</label><input name="amount" type="number" step="0.01" required value="${item?.amount || ''}"></div>
            <div class="field"><label>Data</label><input name="date" type="date" required value="${escapeAttr(item?.date || `${state.selectedMonth}-01`)}"></div>
          </div>

          <div class="inline"><button class="btn" type="submit">Salvar</button><button class="btn secondary" type="button" onclick="closeDialog()">Cancelar</button></div>
        </form>
      `);
    }
    function saveIncome(event,id=''){
      event.preventDefault();
      const fd = new FormData(event.target);

        id:id||uid('inc'),
        month:(fd.get('date')||`${state.selectedMonth}-01`).slice(0,7),

        amount:Number(fd.get('amount')||0),

      };

        const idx = state.income.findIndex(x=>x.id===id);

    function deleteIncome(id){
      if(!confirm('Excluir esta entrada?')) return;

      renderAll();
    }

    function openAppointmentForm(id=''){
      const item = id ? state.appointments.find(x=>x.id===id) : null;
      openDialog(`
        <form class="card" style="box-shadow:none;border:none;padding:20px" onsubmit="saveAppointment(event, '${id}')">
          <div class="section-title"><h2 style="margin:0">${item ? 'Editar compromisso' : 'Novo compromisso'}</h2><button type="button" class="btn secondary mini" onclick="closeDialog()">Fechar</button></div>
          <div class="split">
            <div class="field"><label>Título</label><input name="title" required value="${escapeAttr(item?.title || '')}"></div>
            <div class="field"><label>Data</label><input name="date" type="date" required value="${escapeAttr(item?.date || new Date().toISOString().slice(0,10))}"></div>
            <div class="field"><label>Horário</label><input name="time" type="time" value="${escapeAttr(item?.time || '')}"></div>

          </div>
          <div class="field"><label>Observação</label><textarea name="notes" rows="3">${escapeHtml(item?.notes || '')}</textarea></div>
          <div class="inline"><button class="btn" type="submit">Salvar</button><button class="btn secondary" type="button" onclick="closeDialog()">Cancelar</button></div>
        </form>
      `);
    }
    function saveAppointment(event,id=''){
      event.preventDefault();
      const fd = new FormData(event.target);
      const item = { id:id||uid('apt'), title:fd.get('title'), date:fd.get('date'), time:fd.get('time'), location:fd.get('location'), notes:fd.get('notes') };
      if(id){
        const idx = state.appointments.findIndex(x=>x.id===id);
        state.appointments[idx] = { ...state.appointments[idx], ...item };
      }else state.appointments.push(item);
      closeDialog();
      renderAll();
    }
    function deleteAppointment(id){ if(confirm('Excluir este compromisso?')){ state.appointments = state.appointments.filter(x=>x.id!==id); renderAll(); } }

    function openTaskForm(id=''){
      const item = id ? state.tasks.find(x=>x.id===id) : null;
      openDialog(`
        <form class="card" style="box-shadow:none;border:none;padding:20px" onsubmit="saveTask(event, '${id}')">
          <div class="section-title"><h2 style="margin:0">${item ? 'Editar tarefa' : 'Nova tarefa'}</h2><button type="button" class="btn secondary mini" onclick="closeDialog()">Fechar</button></div>
          <div class="split">
            <div class="field"><label>Título</label><input name="title" required value="${escapeAttr(item?.title || '')}"></div>
            <div class="field"><label>Prazo</label><input name="deadline" type="date" value="${escapeAttr(item?.deadline || '')}"></div>
            <div class="field"><label>Prioridade</label><select name="priority"><option ${item?.priority==='baixa'?'selected':''}>baixa</option><option ${item?.priority==='média'?'selected':''}>média</option><option ${item?.priority==='alta'?'selected':''}>alta</option></select></div>
            <div class="field"><label>Status</label><select name="status"><option ${item?.status==='pendente'?'selected':''}>pendente</option><option ${item?.status==='em andamento'?'selected':''}>em andamento</option><option ${item?.status==='concluída'?'selected':''}>concluída</option></select></div>
          </div>
          <div class="field"><label>Descrição</label><textarea name="description" rows="3">${escapeHtml(item?.description || '')}</textarea></div>
          <div class="inline"><button class="btn" type="submit">Salvar</button><button class="btn secondary" type="button" onclick="closeDialog()">Cancelar</button></div>
        </form>
      `);
    }
    function saveTask(event,id=''){
      event.preventDefault();
      const fd = new FormData(event.target);
      const item = { id:id||uid('tsk'), title:fd.get('title'), deadline:fd.get('deadline'), priority:fd.get('priority'), status:fd.get('status'), description:fd.get('description') };
      if(id){ const idx = state.tasks.findIndex(x=>x.id===id); state.tasks[idx] = { ...state.tasks[idx], ...item }; } else state.tasks.push(item);
      closeDialog();
      renderAll();
    }
    function completeTask(id){ const i = state.tasks.find(x=>x.id===id); if(i){ i.status='concluída'; renderAll(); } }
    function reopenTask(id){ const i = state.tasks.find(x=>x.id===id); if(i){ i.status='pendente'; renderAll(); } }
    function deleteTask(id){ if(confirm('Excluir esta tarefa?')){ state.tasks = state.tasks.filter(x=>x.id!==id); renderAll(); } }

    function setShoppingView(view){ state.shoppingView=view; renderAll(); }
    function openShoppingForm(id=''){
      const item = id ? state.shopping.find(x=>x.id===id) : null;
      openDialog(`
        <form class="card" style="box-shadow:none;border:none;padding:20px" onsubmit="saveShopping(event, '${id}')">
          <div class="section-title"><h2 style="margin:0">${item ? 'Editar item' : 'Novo item de compra'}</h2><button type="button" class="btn secondary mini" onclick="closeDialog()">Fechar</button></div>
          <div class="split">
            <div class="field"><label>Nome do item</label><input name="name" required value="${escapeAttr(item?.name || '')}"></div>
            <div class="field"><label>Quantidade</label><input name="quantity" value="${escapeAttr(item?.quantity || '')}" placeholder="Ex: 2, 1 caixa, 500g"></div>
            <div class="field"><label>Categoria</label><select name="category"><option ${item?.category==='mercado'?'selected':''}>mercado</option><option ${item?.category==='farmácia'?'selected':''}>farmácia</option><option ${item?.category==='diversos'?'selected':''}>diversos</option></select></div>
            <div class="field"><label>Prioridade</label><select name="priority"><option ${item?.priority==='baixa'?'selected':''}>baixa</option><option ${item?.priority==='média'?'selected':''}>média</option><option ${item?.priority==='alta'?'selected':''}>alta</option></select></div>
          </div>
          <div class="field"><label>Observação</label><textarea name="notes" rows="3">${escapeHtml(item?.notes || '')}</textarea></div>
          <div class="inline"><label><input name="done" type="checkbox" ${item?.done ? 'checked' : ''}> Já foi comprado</label></div>
          <div class="inline" style="margin-top:16px"><button class="btn" type="submit">Salvar</button><button class="btn secondary" type="button" onclick="closeDialog()">Cancelar</button></div>
        </form>
      `);
    }
    function saveShopping(event,id=''){
      event.preventDefault();
      const fd = new FormData(event.target);
      const item = { id:id||uid('shop'), name:fd.get('name'), quantity:fd.get('quantity'), category:fd.get('category'), priority:fd.get('priority'), notes:fd.get('notes'), done: fd.get('done')==='on' };
      if(id){ const idx = state.shopping.findIndex(x=>x.id===id); state.shopping[idx] = { ...state.shopping[idx], ...item }; } else state.shopping.push(item);
      state.shoppingView = item.category;
      closeDialog();
      renderAll();
    }
    function toggleShopping(id){ const i = state.shopping.find(x=>x.id===id); if(i){ i.done=!i.done; renderAll(); } }
    function deleteShopping(id){ if(confirm('Excluir este item?')){ state.shopping = state.shopping.filter(x=>x.id!==id); renderAll(); } }

    function exportData(){
      const blob = new Blob([JSON.stringify(state,null,2)], {type:'application/json'});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `jarvis-backup-${new Date().toISOString().slice(0,10)}.json`;
      a.click();
      URL.revokeObjectURL(url);
    }
    document.getElementById('importFile').addEventListener('change', function(){
      const file = this.files[0]; if(!file) return;
      const reader = new FileReader();
      reader.onload = e => {
        try{
          const data = JSON.parse(e.target.result);
          state = { ...defaultState(), ...data, currentTab:'inicio' };
          ensureRecurringForMonth(state.selectedMonth);
          renderAll();
          alert('Backup importado com sucesso.');
        }catch{
          alert('Não consegui importar esse arquivo.');
        }
      };
      reader.readAsText(file);
      this.value='';
    });
    function resetSystem(){
      if(!confirm('Tem certeza que deseja apagar tudo?')) return;
      localStorage.removeItem(STORAGE_KEY);
      state = defaultState();
      ensureRecurringForMonth(state.selectedMonth);
      renderAll();
    }
    function loadDemoData(){
      const month = state.selectedMonth;
      state.income.push({id:uid('inc'), month, description:'Entrada principal', category:'Receita', amount:23000, date:`${month}-05`, notes:''});
      state.appointments.push({id:uid('apt'), title:'Consulta', date:`${month}-12`, time:'09:00', location:'Clínica', notes:'Levar documentos'});
      state.tasks.push({id:uid('tsk'), title:'Conferir contas do mês', deadline:`${month}-10`, priority:'alta', status:'pendente', description:'Olhar tudo antes do vencimento.'});
      state.shopping.push({id:uid('shop'), name:'Arroz', quantity:'2 pacotes', category:'mercado', priority:'alta', notes:'Tipo 1', done:false});
      state.shopping.push({id:uid('shop'), name:'Sabonete', quantity:'4 unidades', category:'farmácia', priority:'média', notes:'', done:false});
      renderAll();
    }

    function openDialog(content){
      const d = document.getElementById('formDialog');
      if(d.open) d.close();
      d.innerHTML = content;
      d.showModal();
    }
    function closeDialog(){ document.getElementById('formDialog').close(); }

    function escapeHtml(str=''){ return String(str).replace(/[&<>"']/g, s => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s])); }
    function escapeAttr(str=''){ return escapeHtml(str); }

    window.switchTab = switchTab;
    window.changeMonth = changeMonth;
    window.changeFinanceYear = changeFinanceYear;
    window.setFinanceView = setFinanceView;
    window.openFinanceMonth = openFinanceMonth;
    window.openMonthEntries = openMonthEntries;
    window.openMonthExpenses = openMonthExpenses;
    window.openMonthGoal = openMonthGoal;

    window.togglePaid = togglePaid;
    window.deleteExpense = deleteExpense;
    window.openExpenseForm = openExpenseForm;
    window.saveExpense = saveExpense;
    window.openIncomeForm = openIncomeForm;
    window.saveIncome = saveIncome;
    window.deleteIncome = deleteIncome;
    window.openAppointmentForm = openAppointmentForm;
    window.saveAppointment = saveAppointment;
    window.deleteAppointment = deleteAppointment;
    window.openTaskForm = openTaskForm;
    window.saveTask = saveTask;
    window.completeTask = completeTask;
    window.reopenTask = reopenTask;
    window.deleteTask = deleteTask;
    window.setShoppingView = setShoppingView;
    window.openShoppingForm = openShoppingForm;
    window.saveShopping = saveShopping;
    window.toggleShopping = toggleShopping;
    window.deleteShopping = deleteShopping;
    window.openQuickAction = openQuickAction;
    window.closeDialog = closeDialog;
    window.updateSetting = updateSetting;
    window.exportData = exportData;
    window.resetSystem = resetSystem;
    window.loadDemoData = loadDemoData;
    window.logout = logout;
  </script>
</body>
